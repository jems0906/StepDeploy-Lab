name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'
        cache: true
    
    - name: Run tests
      run: |
        for dir in services/*/; do
          if [ -d "$dir" ]; then
            echo "Testing $(basename $dir)..."
            cd "$dir"
            go test ./... -v
            cd - > /dev/null
          fi
        done
    
    - name: Run linter
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest
        args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    
    permissions:
      contents: read
      id-token: write
    
    strategy:
      matrix:
        service: 
          - idp-mock
          - ca-service
          - enrollment-agent
          - protected-service
          - diagnostics-api
          - frontend
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: ${{ matrix.service == 'frontend' && './frontend' || '.' }}
        file: ${{ matrix.service == 'frontend' && './frontend/Dockerfile' || format('./services/{0}/Dockerfile', matrix.service) }}
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Validate image
      run: |
        if [ "${{ matrix.service }}" = "frontend" ]; then
          docker build -t stepdeploy-${{ matrix.service }}:test -f frontend/Dockerfile frontend
        else
          docker build -t stepdeploy-${{ matrix.service }}:test -f services/${{ matrix.service }}/Dockerfile .
        fi
        docker inspect stepdeploy-${{ matrix.service }}:test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'
    
    - name: Lint Go code
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest
    
    - name: Format check
      run: |
        if ! gofmt -l . | grep -q .; then
          echo "Go code is formatted correctly"
        else
          echo "Go code needs formatting:"
          gofmt -l .
          exit 1
        fi

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'
    
    - name: Run Gosec
      uses: securego/gosec@master
      with:
        args: ./...
    
    - name: Check Go dependencies
      run: |
        go list -json -m all | \
        docker run -i sonatypecommunity/nancy:latest sleuth -x || true

  docker-compose:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Validate docker-compose
      run: |
        docker compose config > /dev/null
    
    - name: Start services
      run: |
        docker compose up -d
        sleep 10
    
    - name: Health check
      run: |
        for i in {1..10}; do
          if curl -s http://localhost:8080/health > /dev/null; then
            echo "✓ Services are healthy"
            exit 0
          fi
          echo "Waiting for services... (attempt $i/10)"
          sleep 5
        done
        echo "✗ Services failed to start"
        docker compose logs
        exit 1
    
    - name: Cleanup
      if: always()
      run: docker compose down -v

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check README exists
      run: test -f README.md
    
    - name: Check documentation
      run: |
        test -f docs/architecture.md
        test -f docs/escalation_playbook.md
        test -f docs/runbooks/expired-oauth-token.md
        test -f docs/runbooks/bad-client-cert.md
        test -f docs/runbooks/missing-ca-trust-chain.md
        test -f docs/runbooks/service-unavailable.md
        echo "✓ Documentation is complete"
